services:
  pawcare-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-pawcare-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pawcare-client}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
